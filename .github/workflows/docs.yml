name: Build and Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      # docs/manual/ only, not all of docs/: the rest is repository-only
      # Markdown that Sphinx never reads, and editing it should not redeploy
      # the site. See docs/README.md.
      - 'docs/manual/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/manual/requirements.txt

      - name: Build English documentation
        run: |
          cd docs/manual
          sphinx-build -b html -D language=en . _build/html/en

      - name: Build Korean documentation
        run: |
          cd docs/manual
          sphinx-build -b html -D language=ko . _build/html/ko

      - name: Create index redirect
        run: |
          cat > docs/manual/_build/html/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=en/index.html">
            <link rel="canonical" href="en/index.html">
            <title>Redirecting to English documentation...</title>
          </head>
          <body>
            <p>Redirecting to <a href="en/index.html">English documentation</a>...</p>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/manual/_build/html'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
