name: Reusable Build Workflow
on:
  workflow_call:
    inputs:
      build_number:
        required: true
        type: string

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Windows dependencies
        run: |
          python -m pip install --upgrade pip
          # Locked, hash-verified dependencies so the shipped installer is
          # built from exactly the packages CI tested (see `make lock`).
          # requirements-build-<os>.lock includes the runtime deps plus the
          # build toolchain (pyinstaller, maturin), all pinned with hashes.
          pip install --require-hashes -r requirements-build-windows.lock

      - name: Build Rust module
        shell: pwsh
        run: |
          maturin build --release --interpreter python3.12
          $wheel = Get-ChildItem -Path "target\wheels\*.whl" | Select-Object -First 1
          pip install $wheel.FullName

      - name: Get Version String
        id: get_version
        shell: bash
        run: echo "VERSION=$(python -c 'from version import __version__; print(__version__)')" >> $GITHUB_OUTPUT

      - name: Debug Version String
        run: echo "Version string captured - ${{ steps.get_version.outputs.VERSION }}"

      - name: Download and Install Inno Setup
        shell: pwsh
        run: |
          # jrsoftware.org only keeps the latest 6.x under /is/6/, so the pinned
          # innosetup-6.2.2.exe this used to fetch started returning 404 and took
          # every Windows installer build down with it. GitHub release assets are
          # permanent, so pin the installer there instead. Same source and same
          # version as Modan2, which hit this first.
          $inno_url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          $inno_installer = "innosetup-installer.exe"
          Invoke-WebRequest -Uri $inno_url -OutFile $inno_installer
          Start-Process -FilePath $inno_installer -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-" -Wait

          # Add to PATH for this session
          $env:PATH = "C:\Program Files (x86)\Inno Setup 6;$env:PATH"

          # Verify installation
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            echo "Inno Setup installed successfully"
            echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            echo "ERROR: Inno Setup installation failed"
            exit 1
          }

      - name: Build Windows Executables and Installer
        shell: pwsh
        run: |
          $env:BUILD_NUMBER = "${{ inputs.build_number }}"
          # Ensure Inno Setup is in PATH
          $env:PATH = "C:\Program Files (x86)\Inno Setup 6;$env:PATH"
          python build.py --onedir
          # List output directories to debug
          echo "=== Listing InnoSetup directory ==="
          if (Test-Path "InnoSetup") {
            Get-ChildItem -Path "InnoSetup" -Recurse | Format-Table FullName
          }
          echo "=== Listing dist directory ==="
          if (Test-Path "dist") {
            Get-ChildItem -Path "dist" -Name
          }
          echo "=== Checking for installer ==="
          if (Test-Path "InnoSetup/Output") {
            echo "InnoSetup/Output exists:"
            Get-ChildItem -Path "InnoSetup/Output" -Name
          } else {
            echo "InnoSetup/Output does not exist"
          }

      # Launch the frozen onedir build headless and assert it boots to a main
      # window then exits 0 (CTHarvester.py --self-test). The exe is
      # self-contained -- it uses its bundled Python and libraries, not the build
      # venv -- so this catches the "works from source, broken when frozen" class
      # that source-tree tests cannot reach: a spec file missing an --add-data
      # entry, or a native library that never got bundled.
      - name: Smoke-test frozen build (Windows)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $exe = "dist/CTHarvester/CTHarvester.exe"
          if (-not (Test-Path $exe)) {
            echo "ERROR: $exe not found"
            if (Test-Path "dist") { Get-ChildItem -Path "dist" -Recurse -Name }
            exit 1
          }
          # Start-Process -Wait so a windowed (--noconsole) app is actually awaited.
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { echo "Smoke test FAILED: exit $($p.ExitCode)"; exit 1 }
          echo "Smoke test passed"

      - name: Zip Windows Installer or Portable Build
        shell: pwsh
        if: success()
        run: |
          # Check for installer in InnoSetup/Output/
          $installerFound = $false
          if (Test-Path "InnoSetup/Output/") {
            $installerPath = Get-ChildItem -Path "InnoSetup/Output/" -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($installerPath) {
              $zipFileName = "CTHarvester-Windows-Installer-v${{ steps.get_version.outputs.VERSION }}-build${{ inputs.build_number }}.zip"
              Compress-Archive -Path $installerPath.FullName -DestinationPath $zipFileName
              echo "Zipped installer to $zipFileName"
              $installerFound = $true
            }
          }

          # If no installer, create portable zip
          if (-not $installerFound) {
            echo "No installer found, creating portable zip"
            $zipFileName = "CTHarvester-Windows-Portable-v${{ steps.get_version.outputs.VERSION }}-build${{ inputs.build_number }}.zip"
            if (Test-Path "dist/CTHarvester") {
              Compress-Archive -Path "dist/CTHarvester/*" -DestinationPath $zipFileName
              echo "Created portable zip: $zipFileName"
            } elseif (Test-Path "dist/CTHarvester.exe") {
              Compress-Archive -Path "dist/*" -DestinationPath $zipFileName
              echo "Created portable zip: $zipFileName"
            } else {
              echo "ERROR: CTHarvester executable not found in dist/"
              exit 1
            }
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: ctharvester-windows
          path: |
            CTHarvester-Windows-*.zip
          retention-days: 14

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install macOS system dependencies
        run: |
          brew install qt5 create-dmg
          echo "export PATH=/usr/local/opt/qt5/bin:$PATH" >> ~/.bash_profile
          echo "export LDFLAGS=-L/usr/local/opt/qt5/lib" >> ~/.bash_profile
          echo "export CPPFLAGS=-I/usr/local/opt/qt5/include" >> ~/.bash_profile

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Locked, hash-verified dependencies so the shipped installer is
          # built from exactly the packages CI tested (see `make lock`).
          # requirements-build-<os>.lock includes the runtime deps plus the
          # build toolchain (pyinstaller, maturin), all pinned with hashes.
          pip install --require-hashes -r requirements-build-macos.lock

      - name: Build Rust module
        run: |
          maturin build --release --interpreter python3.12
          WHEEL=$(find target/wheels -name "*.whl" | head -1)
          pip install "$WHEEL"

      - name: Get Version String
        id: get_version
        shell: bash
        run: echo "VERSION=$(python -c 'from version import __version__; print(__version__)')" >> $GITHUB_OUTPUT

      - name: Debug Version String
        run: echo "Version string captured - ${{ steps.get_version.outputs.VERSION }}"

      - name: Build macOS application
        run: |
          export PATH=/usr/local/opt/qt5/bin:$PATH
          python build.py --onedir
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}

      # Launch the frozen onedir build headless and assert it boots to a main
      # window then exits 0 (CTHarvester.py --self-test). The exe is
      # self-contained -- it uses its bundled Python and libraries, not the build
      # venv -- so this catches the "works from source, broken when frozen" class
      # that source-tree tests cannot reach: a spec file missing an --add-data
      # entry, or a native library that never got bundled.
      # macOS has no `timeout`; the in-app --self-test watchdog is what bounds it.
      - name: Smoke-test frozen build (macOS)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          exe="dist/CTHarvester/CTHarvester"
          if [ ! -x "$exe" ]; then
            echo "ERROR: $exe not found"; ls -la dist/ dist/CTHarvester 2>/dev/null || true; exit 1
          fi
          "$exe" --self-test
          echo "Smoke test passed"

      # PyInstaller's BUNDLE() builds dist/CTHarvester.app (see
      # CTHarvester_onedir.spec), so this only checks the result. It replaces a
      # step that assembled the bundle by hand with `mkdir Contents/MacOS` and
      # `cp -r dist/*`, which was wrong twice: the glob matched the
      # destination's own .app, so BSD cp copied the bundle into itself and the
      # v0.2.3-beta.4 DMG shipped the application twice (553.9 MB of content
      # for a ~277 MB build), and without an Info.plist the executable macOS
      # looks for at Contents/MacOS/CTHarvester was a directory.
      #
      # Both failures were silent -- the copy ended in `2>/dev/null || true`
      # and nothing ever inspected the bundle -- so the checks below are the
      # point of the step, not ceremony.
      - name: Verify macOS app bundle
        run: |
          app="dist/CTHarvester.app"
          plist="$app/Contents/Info.plist"
          test -d "$app"   || { echo "::error::$app was not produced by PyInstaller"; ls -la dist/; exit 1; }
          test -f "$plist" || { echo "::error::$app has no Info.plist"; exit 1; }

          read_key() { /usr/libexec/PlistBuddy -c "Print :$1" "$plist"; }
          exe="$app/Contents/MacOS/$(read_key CFBundleExecutable)"
          test -f "$exe" && test -x "$exe" \
            || { echo "::error::CFBundleExecutable does not resolve to a program: $exe"; exit 1; }

          echo "identifier : $(read_key CFBundleIdentifier)"
          echo "version    : $(read_key CFBundleShortVersionString) (build $(read_key CFBundleVersion))"
          echo "executable : $exe"
          echo "bundle size: $(du -sh "$app" | cut -f1)"

      # Run the shipped artifact, not just the COLLECT tree the smoke test
      # above uses: BUNDLE rearranges the layout, so this is the first thing
      # that exercises what the DMG actually contains.
      - name: Smoke-test the app bundle (macOS)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          "dist/CTHarvester.app/Contents/MacOS/CTHarvester" --self-test
          echo "App bundle smoke test passed"

      - name: Create macOS DMG
        # No `|| echo ... continuing`: a DMG that fails to build should fail the
        # job rather than leave the upload step to publish nothing. The former
        # `--icon` argument is gone with it -- it pointed at icons/CTHarvester.png
        # and icon.png, neither of which exists (the tree has
        # resources/icons/), so the variable was always empty, and create-dmg's
        # --icon takes `<name> <x> <y>` rather than a file to use as artwork.
        run: |
          create-dmg \
            --volname "CTHarvester Installer" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "CTHarvester.app" 200 190 \
            --hide-extension "CTHarvester.app" \
            --app-drop-link 600 185 \
            --hdiutil-verbose \
            "CTHarvester-macOS-Installer-v${{ steps.get_version.outputs.VERSION }}-build${{ inputs.build_number }}.dmg" \
            "dist/CTHarvester.app"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: ctharvester-macos
          path: |
            CTHarvester-macOS-Installer-v${{ steps.get_version.outputs.VERSION }}-build${{ inputs.build_number }}.dmg
          retention-days: 14

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-xinerama0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xfixes0 \
            libxcb-shape0 \
            libxcb-cursor0 \
            qt5-qmake \
            qtbase5-dev \
            libqt5gui5 \
            libqt5core5a \
            libqt5widgets5 \
            libglu1-mesa \
            freeglut3-dev \
            python3-opengl \
            fuse

      - name: Download linuxdeploy and appimagetool
        run: |
          curl -LO https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -LO https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage appimagetool-x86_64.AppImage
          sudo mv linuxdeploy-x86_64.AppImage /usr/local/bin/linuxdeploy
          sudo mv appimagetool-x86_64.AppImage /usr/local/bin/appimagetool

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Locked, hash-verified dependencies so the shipped installer is
          # built from exactly the packages CI tested (see `make lock`).
          # requirements-build-<os>.lock includes the runtime deps plus the
          # build toolchain (pyinstaller, maturin), all pinned with hashes.
          pip install --require-hashes -r requirements-build-linux.lock

      - name: Build Rust module
        run: |
          maturin build --release --interpreter python3.12
          WHEEL=$(find target/wheels -name "*.whl" | head -1)
          pip install "$WHEEL"

      - name: Get Version String
        id: get_version
        run: echo "VERSION=$(python -c 'from version import __version__; print(__version__)')" >> $GITHUB_OUTPUT

      - name: Build Linux executable
        run: |
          python build.py --onedir
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}

      # Launch the frozen onedir build headless and assert it boots to a main
      # window then exits 0 (CTHarvester.py --self-test). The exe is
      # self-contained -- it uses its bundled Python and libraries, not the build
      # venv -- so this catches the "works from source, broken when frozen" class
      # that source-tree tests cannot reach: a spec file missing an --add-data
      # entry, or a native library that never got bundled.
      # Xvfb even under the offscreen Qt platform: the 3D widget calls into GLUT
      # at construction, which segfaults with no display at all. Same reason
      # test.yml wraps pytest in xvfb-run.
      - name: Smoke-test frozen build (Linux)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1024x768x24 >/tmp/xvfb.log 2>&1 &
          export DISPLAY=:99
          sleep 2
          exe="dist/CTHarvester/CTHarvester"
          if [ ! -x "$exe" ]; then
            echo "ERROR: $exe not found"; ls -la dist/ dist/CTHarvester 2>/dev/null || true; exit 1
          fi
          timeout 120 "$exe" --self-test
          echo "Smoke test passed"

      - name: Create Linux AppImage
        run: |
          # Use the packaging script
          chmod +x packaging/linux/create_appimage.sh
          packaging/linux/create_appimage.sh v${{ steps.get_version.outputs.VERSION }}-build${{ inputs.build_number }}

          # Move AppImage to root directory for consistent artifact upload
          if [ -f "build_linux/CTHarvester-Linux-v${{ steps.get_version.outputs.VERSION }}-build${{ inputs.build_number }}.AppImage" ]; then
            mv build_linux/CTHarvester-Linux-v${{ steps.get_version.outputs.VERSION }}-build${{ inputs.build_number }}.AppImage ./
          fi

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v6
        with:
          name: ctharvester-linux
          path: CTHarvester-Linux-v${{ steps.get_version.outputs.VERSION }}-build${{ inputs.build_number }}.AppImage
          retention-days: 14
