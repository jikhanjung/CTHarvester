name: Security

# Mirrors Modan2's security.yml shape: a single security workflow.
# Combines dependency CVE scanning (pip-audit), static code security (bandit),
# and a dependency-lock freshness gate. CodeQL SAST lives in its own workflow
# (codeql.yml) because GitHub's action wants a dedicated job/permissions block.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly (Mon 06:00 UTC) so newly-disclosed CVEs in already-pinned
    # dependencies surface even without a commit.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (dependency CVEs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install pip-audit

      # Audit the locked runtime dependencies (the exact versions we ship).
      # Fails (non-zero) if any has a known vulnerability. If an unfixable
      # advisory appears, add `--ignore-vuln <ID>` with a comment rather than
      # dropping the gate.
      #
      # All three platform locks are audited from this one Linux runner, not
      # just its own: the locks pin different versions per platform (pyqt5-qt5
      # is 5.15.2 on Windows against 5.15.19 elsewhere), so auditing only the
      # Linux lock would never look at what Windows and macOS actually ship.
      # `--no-deps` audits the pinned lines as given instead of resolving them,
      # which is what makes a foreign platform's lock auditable here; the locks
      # are complete, so there is nothing left to resolve anyway.
      - name: Audit runtime dependencies (all platforms)
        run: |
          for lock in requirements-linux.lock requirements-windows.lock requirements-macos.lock; do
            echo "::group::$lock"
            pip-audit --no-deps -r "$lock"
            echo "::endgroup::"
          done

  bandit:
    name: bandit (code security)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bandit
        run: pip install "bandit[toml]"

      # Medium+ severity only (`-ll`); B101 (assert) is noise in this codebase.
      # Scoped to shipped code, excluding tests.
      - name: Run bandit
        run: bandit -r core/ utils/ ui/ security/ config/ -ll -s B101

  dependency-lock:
    name: dependency lock freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      # Gating: a dependency change in pyproject.toml that forgets to re-lock
      # means CI and release builds would install something different from what
      # was reviewed. `make lock-check` regenerates and diffs (ignoring headers).
      - name: Verify lockfiles match pyproject.toml
        run: make lock-check

      # This runner is Linux, so only the Linux lock can be dry-run installed
      # here. The other two are exercised by the Windows and macOS legs of the
      # test matrix, which install their own lock for real.
      - name: Verify the lockfile installs with hashes
        run: pip install --require-hashes --dry-run -r requirements-linux.lock
