name: Quick Tests (CI)

# Fast test suite for CI/CD - excludes slow performance and stress tests
# For comprehensive testing including all slow tests, see test-full.yml
#
# CTHarvester ships installers for Windows, macOS and Linux, so the test matrix
# covers all three. Testing only on Linux leaves the platform most users run
# entirely untested.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_call:  # so release.yml can gate a release on this workflow

jobs:
  # ---------------------------------------------------------------------------
  # Lint / format / type — runs once (not per-OS). Consolidated here from the
  # former quality-gates.yml to mirror Modan2's single-file layout.
  # Gating: black, isort, flake8 real-error subset. Advisory: full flake8, mypy
  # (the Ruff migration and gating-hardening are deferred — item 4). Only the
  # workflow structure is aligned with Modan2, not the tool choice.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (black, isort, flake8, mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements*.lock

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock

      - name: black --check
        run: black --check --diff .

      - name: isort --check
        run: isort --check-only --diff .

      # Gating on real errors only (syntax, undefined names). The full flake8
      # ruleset is advisory until the tree is swept (see deferred item 4).
      - name: flake8 (errors)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: flake8 (full, non-gating)
        run: flake8 . --count --statistics || true

      # Advisory (not gating): mypy config pins python_version=3.11, which the
      # numpy 2.5 stubs reject (they use 3.12 `type` syntax). Flipping mypy to
      # gating is part of the deferred lint-hardening pass (bump python_version
      # or scope-exclude numpy first). Kept in CI for signal.
      - name: mypy (typed modules, advisory)
        run: mypy --config-file pyproject.toml core/ utils/ || true

  # Fast fail: if a module does not import or the app does not start on a
  # platform, there is no point running the full suite there.
  smoke:
    name: Smoke (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.13']  # min and max supported

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: |
          requirements*.lock

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          xvfb \
          libxcb-xinerama0 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-randr0 \
          libxcb-render-util0 \
          libxcb-xfixes0 \
          libxcb-shape0 \
          libxcb-cursor0 \
          libegl1 \
          libgl1 \
          libglu1-mesa \
          freeglut3-dev

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        # Install from the lockfile so CI, contributors and release builds all
        # get byte-identical dependencies. Regenerate with `make lock`.
        pip install --require-hashes -r requirements-dev.lock

    - name: Run smoke tests (Linux)
      if: runner.os == 'Linux'
      env:
        QT_QPA_PLATFORM: offscreen
      run: xvfb-run -a -s "-screen 0 1024x768x24" pytest tests/test_smoke.py -m smoke --timeout=120

    - name: Run smoke tests (Windows/macOS)
      if: runner.os != 'Linux'
      env:
        QT_QPA_PLATFORM: offscreen
      run: pytest tests/test_smoke.py -m smoke --timeout=120

  test:
    name: Tests (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
        exclude:
          # Full Python sweep on Linux; min/max only on Windows and macOS to
          # keep the matrix affordable.
          - os: windows-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.12'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: |
          requirements*.lock

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          xvfb \
          libxcb-xinerama0 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-randr0 \
          libxcb-render-util0 \
          libxcb-xfixes0 \
          libxcb-shape0 \
          libxcb-cursor0 \
          libegl1 \
          libgl1 \
          libglu1-mesa \
          freeglut3-dev \
          python3-opengl

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        # Install from the lockfile so CI, contributors and release builds all
        # get byte-identical dependencies. Regenerate with `make lock`.
        pip install --require-hashes -r requirements-dev.lock

    - name: Run tests (Linux)
      if: runner.os == 'Linux'
      env:
        QT_QPA_PLATFORM: offscreen
        QT_DEBUG_PLUGINS: 0
      run: |
        # Coverage gate lives here now (was quality-gates.yml). 75% is a ratchet
        # floor; raise it over time. Gate + measurement on the reference leg only.
        COV_ARGS=""
        if [ "${{ matrix.python-version }}" = "3.12" ]; then
          COV_ARGS="--cov-fail-under=75"
        fi
        xvfb-run -a -s "-screen 0 1024x768x24" \
          pytest tests/ \
            -m "not slow and not benchmark" \
            --ignore=tests/test_basic.py \
            -n auto \
            --cov=core --cov=ui --cov=utils --cov=security \
            --cov-report=term-missing \
            --cov-report=xml \
            $COV_ARGS \
            --timeout=60

    - name: Run tests (Windows/macOS)
      if: runner.os != 'Linux'
      env:
        QT_QPA_PLATFORM: offscreen
        QT_DEBUG_PLUGINS: 0
      run: pytest tests/ -m "not slow and not benchmark" --ignore=tests/test_basic.py -n auto --timeout=60

    - name: Upload coverage to Codecov
      # Coverage is measured once, on the reference platform (the same leg that
      # enforces --cov-fail-under above).
      if: always() && runner.os == 'Linux' && matrix.python-version == '3.12'
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-${{ matrix.os }}-${{ matrix.python-version }}
        fail_ci_if_error: false

  docs:
    name: Documentation builds
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Build docs
      # Non-gating for now, matching previous behaviour. Flip to gating as part
      # of the "remove || true / continue-on-error" pass.
      continue-on-error: true
      run: |
        pip install sphinx sphinx-rtd-theme
        cd docs
        make clean
        make html

  test-summary:
    name: Test Matrix Summary
    needs: [lint, smoke, test, docs]
    # docs is advisory; lint, smoke and test decide the verdict below.
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Summarize
      run: |
        echo "## Test Matrix Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
        echo "|---|---|" >> $GITHUB_STEP_SUMMARY
        echo "| Lint (black/isort/flake8/mypy) | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Smoke (3 OS x py3.11/3.13) | ${{ needs.smoke.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Tests (Linux py3.11-3.13, Win/macOS py3.11/3.13) | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Docs | ${{ needs.docs.result }} |" >> $GITHUB_STEP_SUMMARY

        if [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.smoke.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "❌ One or more required jobs failed." >> $GITHUB_STEP_SUMMARY
          exit 1
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ All platforms green." >> $GITHUB_STEP_SUMMARY
