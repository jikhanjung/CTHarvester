name: Quick Tests (CI)

# Fast test suite for CI/CD - excludes slow performance and stress tests
# For comprehensive testing including all slow tests, see test-full.yml
#
# CTHarvester ships installers for Windows, macOS and Linux, so the test matrix
# covers all three. Testing only on Linux leaves the platform most users run
# entirely untested.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # Fast fail: if a module does not import or the app does not start on a
  # platform, there is no point running the full suite there.
  smoke:
    name: Smoke (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.13']  # min and max supported

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: |
          requirements*.lock

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          xvfb \
          libxcb-xinerama0 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-randr0 \
          libxcb-render-util0 \
          libxcb-xfixes0 \
          libxcb-shape0 \
          libxcb-cursor0 \
          libegl1 \
          libgl1 \
          libglu1-mesa \
          freeglut3-dev

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        # Install from the lockfile so CI, contributors and release builds all
        # get byte-identical dependencies. Regenerate with `make lock`.
        pip install --require-hashes -r requirements-dev.lock

    - name: Run smoke tests (Linux)
      if: runner.os == 'Linux'
      env:
        QT_QPA_PLATFORM: offscreen
      run: xvfb-run -a -s "-screen 0 1024x768x24" pytest tests/test_smoke.py -m smoke --timeout=120

    - name: Run smoke tests (Windows/macOS)
      if: runner.os != 'Linux'
      env:
        QT_QPA_PLATFORM: offscreen
      run: pytest tests/test_smoke.py -m smoke --timeout=120

  test:
    name: Tests (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
        exclude:
          # Full Python sweep on Linux; min/max only on Windows and macOS to
          # keep the matrix affordable.
          - os: windows-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.12'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: |
          requirements*.lock

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          xvfb \
          libxcb-xinerama0 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-randr0 \
          libxcb-render-util0 \
          libxcb-xfixes0 \
          libxcb-shape0 \
          libxcb-cursor0 \
          libegl1 \
          libgl1 \
          libglu1-mesa \
          freeglut3-dev \
          python3-opengl

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        # Install from the lockfile so CI, contributors and release builds all
        # get byte-identical dependencies. Regenerate with `make lock`.
        pip install --require-hashes -r requirements-dev.lock

    - name: Run tests (Linux)
      if: runner.os == 'Linux'
      env:
        QT_QPA_PLATFORM: offscreen
        QT_DEBUG_PLUGINS: 0
      run: |
        xvfb-run -a -s "-screen 0 1024x768x24" \
          pytest tests/ \
            -m "not slow and not benchmark" \
            --ignore=tests/test_basic.py \
            -n auto \
            --cov=core --cov=ui --cov=utils --cov=security \
            --cov-report=term-missing \
            --cov-report=xml \
            --timeout=60

    - name: Run tests (Windows/macOS)
      if: runner.os != 'Linux'
      env:
        QT_QPA_PLATFORM: offscreen
        QT_DEBUG_PLUGINS: 0
      run: pytest tests/ -m "not slow and not benchmark" --ignore=tests/test_basic.py -n auto --timeout=60

    - name: Upload coverage to Codecov
      # Coverage is measured once, on the reference platform. The coverage gate
      # itself lives in quality-gates.yml.
      if: always() && runner.os == 'Linux' && matrix.python-version == '3.12'
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-${{ matrix.os }}-${{ matrix.python-version }}
        fail_ci_if_error: false

  docs:
    name: Documentation builds
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Build docs
      # Non-gating for now, matching previous behaviour. Flip to gating as part
      # of the "remove || true / continue-on-error" pass.
      continue-on-error: true
      run: |
        pip install sphinx sphinx-rtd-theme
        cd docs
        make clean
        make html

  test-summary:
    name: Test Matrix Summary
    needs: [smoke, test, docs]
    # docs is advisory; smoke and test decide the verdict below.
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Summarize
      run: |
        echo "## Test Matrix Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
        echo "|---|---|" >> $GITHUB_STEP_SUMMARY
        echo "| Smoke (3 OS x py3.11/3.13) | ${{ needs.smoke.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Tests (Linux py3.11-3.13, Win/macOS py3.11/3.13) | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Docs | ${{ needs.docs.result }} |" >> $GITHUB_STEP_SUMMARY

        if [ "${{ needs.smoke.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "❌ One or more required jobs failed." >> $GITHUB_STEP_SUMMARY
          exit 1
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ All platforms green." >> $GITHUB_STEP_SUMMARY
