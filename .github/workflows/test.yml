name: Quick Tests (CI)

# Fast test suite for CI/CD - excludes slow performance and stress tests
# For comprehensive testing including all slow tests, see test-full.yml
#
# CTHarvester ships installers for Windows, macOS and Linux, so the test matrix
# covers all three. Testing only on Linux leaves the platform most users run
# entirely untested.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_call:  # so release.yml can gate a release on this workflow

jobs:
  # ---------------------------------------------------------------------------
  # Lint / format / type — runs once (not per-OS). Consolidated here from the
  # former quality-gates.yml to mirror Modan2's single-file layout.
  # Gating: ruff check, ruff format --check. Advisory: mypy (see below).
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff, mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements*.lock

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          # ubuntu-latest only, so the Linux lock is named directly.
          pip install --require-hashes -r requirements-dev-linux.lock

      # Gating. The ruff version comes from requirements-dev-linux.lock, which pins it
      # exactly; .pre-commit-config.yaml pins the same version so a contributor's
      # hooks and CI never disagree about formatting.
      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format --check
        run: ruff format --check --diff .

      # Gating as of 2026-07-27. It ran advisory (`|| true`) for weeks because
      # mypy pinned python_version=3.11 while the numpy 2.5 stubs use 3.12
      # `type` syntax; dropping 3.11 moved the config to 3.12 and the tree is
      # clean. Scope is core/ and utils/ -- the modules with per-module strict
      # sections in pyproject.toml -- not the whole codebase. Widen the scope
      # the same way the C901 ratchet was tightened: a directory at a time,
      # each one clean before it is added.
      - name: mypy (typed modules)
        run: mypy --config-file pyproject.toml core/ utils/

  # Fast fail: if a module does not import or the app does not start on a
  # platform, there is no point running the full suite there.
  smoke:
    name: Smoke (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The only supported version (see `requires-python`). Kept as a matrix
        # axis rather than inlined so re-widening is a one-line change.
        python-version: ['3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: |
          requirements*.lock

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          xvfb \
          libxcb-xinerama0 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-randr0 \
          libxcb-render-util0 \
          libxcb-xfixes0 \
          libxcb-shape0 \
          libxcb-cursor0 \
          libegl1 \
          libgl1 \
          libglu1-mesa \
          freeglut3-dev

    - name: Install Python dependencies
      # bash, not the Windows default pwsh, so one script serves all three legs.
      shell: bash
      run: |
        python -m pip install --upgrade pip
        # Install from the lockfile so CI, contributors and release builds all
        # get byte-identical dependencies. Regenerate with `make lock`. The
        # locks are per-platform, so pick the one matching this runner.
        case "${{ runner.os }}" in
          Linux)   LOCK=requirements-dev-linux.lock ;;
          Windows) LOCK=requirements-dev-windows.lock ;;
          macOS)   LOCK=requirements-dev-macos.lock ;;
          *)       echo "No lockfile for runner OS ${{ runner.os }}"; exit 1 ;;
        esac
        pip install --require-hashes -r "$LOCK"

    - name: Run smoke tests (Linux)
      if: runner.os == 'Linux'
      env:
        QT_QPA_PLATFORM: offscreen
      run: xvfb-run -a -s "-screen 0 1024x768x24" pytest tests/test_smoke.py -m smoke --timeout=120

    - name: Run smoke tests (Windows/macOS)
      if: runner.os != 'Linux'
      env:
        QT_QPA_PLATFORM: offscreen
      run: pytest tests/test_smoke.py -m smoke --timeout=120

  test:
    name: Tests (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # One version, three operating systems. The Python sweep went away with
        # 3.11 and 3.13 support; the OS sweep is the axis that finds real bugs
        # here (Qt plugins, path handling, wheel availability).
        python-version: ['3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: |
          requirements*.lock

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          xvfb \
          libxcb-xinerama0 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-randr0 \
          libxcb-render-util0 \
          libxcb-xfixes0 \
          libxcb-shape0 \
          libxcb-cursor0 \
          libegl1 \
          libgl1 \
          libglu1-mesa \
          freeglut3-dev \
          python3-opengl

    - name: Install Python dependencies
      # bash, not the Windows default pwsh, so one script serves all three legs.
      shell: bash
      run: |
        python -m pip install --upgrade pip
        # Install from the lockfile so CI, contributors and release builds all
        # get byte-identical dependencies. Regenerate with `make lock`. The
        # locks are per-platform, so pick the one matching this runner.
        case "${{ runner.os }}" in
          Linux)   LOCK=requirements-dev-linux.lock ;;
          Windows) LOCK=requirements-dev-windows.lock ;;
          macOS)   LOCK=requirements-dev-macos.lock ;;
          *)       echo "No lockfile for runner OS ${{ runner.os }}"; exit 1 ;;
        esac
        pip install --require-hashes -r "$LOCK"

    - name: Run tests (Linux)
      if: runner.os == 'Linux'
      env:
        QT_QPA_PLATFORM: offscreen
        QT_DEBUG_PLUGINS: 0
      run: |
        # Coverage gate lives here now (was quality-gates.yml). 75% is a ratchet
        # floor; raise it over time. This step is Linux-only and there is one
        # Python version, so this leg *is* the reference leg -- the gate used to
        # be guarded by a `matrix.python-version == 3.12` check that is now
        # always true.
        COV_ARGS="--cov-fail-under=75"
        xvfb-run -a -s "-screen 0 1024x768x24" \
          pytest tests/ \
            -m "not slow and not benchmark" \
            --ignore=tests/test_basic.py \
            -n auto \
            --cov=core --cov=ui --cov=utils --cov=security \
            --cov-report=term-missing \
            --cov-report=xml \
            $COV_ARGS \
            --timeout=60

    - name: Run tests (Windows/macOS)
      if: runner.os != 'Linux'
      env:
        QT_QPA_PLATFORM: offscreen
        QT_DEBUG_PLUGINS: 0
      run: pytest tests/ -m "not slow and not benchmark" --ignore=tests/test_basic.py -n auto --timeout=60

    - name: Upload coverage to Codecov
      # Coverage is measured once, on the reference platform (the same leg that
      # enforces --cov-fail-under above).
      if: always() && runner.os == 'Linux'
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-${{ matrix.os }}-${{ matrix.python-version }}
        fail_ci_if_error: false

  docs:
    name: Documentation builds
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Build docs
      # Gating. Installs docs/manual/requirements.txt rather than naming packages here:
      # conf.py imports version.py, which needs semver, and this step listing
      # its own subset is how the docs build came to fail for weeks while
      # continue-on-error reported it green.
      run: |
        pip install -r docs/manual/requirements.txt
        cd docs/manual
        make clean
        make html

  test-summary:
    name: Test Matrix Summary
    needs: [lint, smoke, test, docs]
    # All four are required; the verdict below checks each of them.
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Summarize
      run: |
        echo "## Test Matrix Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
        echo "|---|---|" >> $GITHUB_STEP_SUMMARY
        echo "| Lint (ruff/mypy) | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Smoke (3 OS x py3.12) | ${{ needs.smoke.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Tests (3 OS x py3.12) | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Docs | ${{ needs.docs.result }} |" >> $GITHUB_STEP_SUMMARY

        if [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.smoke.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.docs.result }}" != "success" ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "❌ One or more required jobs failed." >> $GITHUB_STEP_SUMMARY
          exit 1
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ All platforms green." >> $GITHUB_STEP_SUMMARY
