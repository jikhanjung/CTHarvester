# Pre-commit hooks for CTHarvester
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Ruff - linter + formatter, replacing black, isort, flake8, pyupgrade and
  # pylint. Configuration lives in pyproject.toml under [tool.ruff].
  #
  # Keep `rev` in lockstep with the ruff pin in pyproject.toml's dev extra and
  # the `lint` job in .github/workflows/test.yml. A newer ruff reformats code the
  # pinned one accepted, which turns every unrelated PR red.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: ['--fix']
      - id: ruff-format

  # trailing-whitespace - Remove trailing whitespace
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.(md|rst)$'
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--allow-multiple-documents']
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-toml
      - id: debug-statements
      - id: mixed-line-ending
        args: ['--fix=lf']

  # mypy - Type checking, scoped to core/, utils/ and ui/
  #
  # Deliberately a local hook rather than mirrors-mypy. The mirror runs in its
  # own isolated venv, which had drifted badly: it pinned mypy v1.8.0 against
  # the lockfile's 1.20.2, and declared types-Pillow and PyQt5-stubs, neither
  # of which is in any lockfile. mypy's answers depend on the installed stubs,
  # so the hook and CI could disagree in either direction. Running the
  # project's own mypy over the same paths as the CI step makes them the same
  # check by construction; the version is pinned once, in the dev lockfile.
  #
  # pass_filenames is off on purpose: mypy given a file subset follows imports
  # differently than mypy given directories, so the CI invocation is repeated
  # verbatim. ui/widgets/ stays out via `exclude` in pyproject.toml.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (typed modules)
        entry: mypy --config-file pyproject.toml core/ utils/ ui/
        language: system
        types: [python]
        pass_filenames: false
        files: '^(core|utils|ui)/.*\.py$'

  # Bandit - Security linter
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        args: ['-ll', '-s', 'B101,B601']
        exclude: 'tests/|build/|dist/'

# Global settings
default_language_version:
  python: python3.12

# CI settings
ci:
  autofix_commit_msg: 'style: Auto-fix by pre-commit hooks'
  autoupdate_commit_msg: 'chore: Update pre-commit hooks'
