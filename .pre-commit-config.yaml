# Pre-commit hooks for CTHarvester
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Ruff - linter + formatter, replacing black, isort, flake8, pyupgrade and
  # pylint. Configuration lives in pyproject.toml under [tool.ruff].
  #
  # Keep `rev` in lockstep with the ruff pin in pyproject.toml's dev extra and
  # the `lint` job in .github/workflows/test.yml. A newer ruff reformats code the
  # pinned one accepted, which turns every unrelated PR red.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: ['--fix']
      - id: ruff-format

  # trailing-whitespace - Remove trailing whitespace
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.(md|rst)$'
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--allow-multiple-documents']
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-toml
      - id: debug-statements
      - id: mixed-line-ending
        args: ['--fix=lf']

  # mypy - Type checking (enabled for core modules)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies:
          - types-PyYAML
          - types-Pillow
          - numpy
          - PyQt5-stubs
        args:
          - '--config-file=pyproject.toml'
        files: '^(core|utils)/.*\.py$'
        exclude: 'tests/|build/|dist/'

  # Bandit - Security linter
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        args: ['-ll', '-s', 'B101,B601']
        exclude: 'tests/|build/|dist/'

# Global settings
default_language_version:
  python: python3.12

# CI settings
ci:
  autofix_commit_msg: 'style: Auto-fix by pre-commit hooks'
  autoupdate_commit_msg: 'chore: Update pre-commit hooks'
